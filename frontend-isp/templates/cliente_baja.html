{% extends 'base.html' %}
{% block content %}
<h2>Iniciar Trámite de Baja de Servicio</h2>
<form method="POST" enctype="multipart/form-data" class="bg-white p-4 shadow-sm rounded">
    <div class="mb-3">
        <label class="form-label">DNI Titular</label>
        <input type="text" name="dni" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Adjunto DNI (Foto/PDF)</label>
        <input type="file" name="adjuntoDni" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Adjunto Última Factura</label>
        <input type="file" name="adjuntoFactura" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-danger">Confirmar Solicitud de Baja</button>
    <a href="/" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
