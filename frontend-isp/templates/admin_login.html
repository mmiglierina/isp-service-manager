{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h3 class="text-center">Ingreso Administrativos</h3>
        <form method="POST" class="bg-white p-4 border rounded">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="1234" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Entrar al Sistema</button>
        </form>
    </div>
</div>
{% endblock %}
